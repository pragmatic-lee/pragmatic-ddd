server.port=9500

# ===== MySQL 数据源（密码通过环境变量 MYSQL_PASSWORD 注入，避免硬编码） =====
spring.datasource.url=jdbc:mysql://localhost:3306/order_example?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=30000&autoReconnect=false
spring.datasource.username=root
spring.datasource.password=MySqlXXL123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== HikariCP 连接池（生产环境） =====
# 最大连接数：单实例保守设定，按 (DB 最大连接数 / 应用实例数) 估算，避免压垮 MySQL
spring.datasource.hikari.maximum-pool-size=20
# 最小空闲连接：保持少量热连接，降低突发流量建连开销
spring.datasource.hikari.minimum-idle=5
# 获取连接的最长等待时间：超过则抛异常，避免线程无限阻塞
spring.datasource.hikari.connection-timeout=30000
# 空闲连接回收时间：仅在 minimum-idle < maximum-pool-size 时生效
spring.datasource.hikari.idle-timeout=600000
# 连接最大存活时间：必须小于 MySQL wait_timeout（默认 28800s），防拿到已断开的死连接
spring.datasource.hikari.max-lifetime=1800000
# 保活探测间隔：主动探活，防止网络空闲导致连接被中间设备断开
spring.datasource.hikari.keepalive-time=300000
# 连接校验：借出时校验存活，结合 MySQL 的 socket 超时避免静默失效
spring.datasource.hikari.validation-timeout=5000

# ===== Elasticsearch 8.17（用户名/密码通过环境变量注入，避免硬编码） =====
# 集群节点，多个节点以英文逗号分隔，例如 http://es1:9200,http://es2:9200
elasticsearch.hosts=http://localhost:9200
elasticsearch.username=
# 密码优先读取环境变量 ES_PASSWORD，占位符回退到空串（由 ElasticSearchConfig 决定是否启用认证）
elasticsearch.password=
# 建连超时（毫秒）：与 MySQL connectTimeout 对齐，防止线程无限阻塞
elasticsearch.connect-timeout=3000
# 数据传输超时（毫秒）
elasticsearch.socket-timeout=30000

# ===== RocketMQ 4.x（Remoting，地址通过环境变量 ROCKETMQ_NAMESRV 注入，避免硬编码） =====
rocketmq.name-server=${ROCKETMQ_NAMESRV:127.0.0.1:9876}
rocketmq.producer-group=${ROCKETMQ_PRODUCER_GROUP:order_example_producer}
rocketmq.consumer-group=${ROCKETMQ_CONSUMER_GROUP:order_example_consumer}
rocketmq.retry-times-when-send-failed=3
rocketmq.send-msg-timeout=3000
rocketmq.max-reconsume-times=16